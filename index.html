<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster | Premium Task Manager</title>
    <meta name="description"
        content="A premium, accessible, and responsive task manager built with native web technologies.">
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container" id="app">
        <header class="top-bar">
            <div class="brand">
                <h1 id="logo"><span class="logo-task">Task</span><span class="logo-master">Master</span></h1>
                <div class="brand-meta">
                    <p class="subtitle">Organize your thoughts, one task at a time.</p>
                    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                        <svg class="sun-icon" viewBox="0 0 24 24" width="16" height="16" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg class="moon-icon" viewBox="0 0 24 24" width="16" height="16" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="productivity-circle-container" id="productivity-card">
                <svg class="progress-ring" width="60" height="60">
                    <circle class="progress-ring__background" stroke="#e2e8f0" stroke-width="5" fill="transparent"
                        r="25" cx="30" cy="30" />
                    <circle class="progress-ring__circle" id="productivity-ring" stroke="var(--primary)"
                        stroke-width="5" fill="transparent" r="25" cx="30" cy="30" />
                </svg>
                <div class="productivity-value" id="productivity-percent">0%</div>
            </div>
        </header>

        <main>
            <section class="input-section" aria-label="Add new task">
                <form id="todo-form">
                    <div class="form-main">
                        <input type="text" id="todo-input" placeholder="What needs to be done?"
                            aria-label="New task title" autocomplete="off" required>
                        <button type="submit" id="add-btn" aria-label="Add task">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="form-details">
                        <input type="text" id="todo-desc" placeholder="Add a description (optional)"
                            aria-label="Task description">
                        <div class="date-input-wrapper">
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                            <input type="date" id="todo-date" aria-label="Due date">
                        </div>
                    </div>
                </form>
            </section>

            <section class="list-section" aria-label="Task list">
                <div class="filters-bar">
                    <div class="filters" id="status-filters">
                        <button class="filter-btn active" data-filter="all">All <span class="count"
                                id="count-all">0</span></button>
                        <button class="filter-btn" data-filter="active">Active <span class="count"
                                id="count-active">0</span></button>
                        <button class="filter-btn" data-filter="completed">Completed <span class="count"
                                id="count-completed">0</span></button>
                        <button class="filter-btn" data-filter="overdue">Overdue <span class="count"
                                id="count-overdue">0</span></button>
                    </div>
                </div>

                <ul id="todo-list" class="todo-list" aria-live="polite">
                    <!-- Tasks will be injected here -->
                </ul>
            </section>
        </main>

        <footer>
            <p>Drag and drop to reorder tasks</p>
            <button id="clear-completed" class="clear-btn">Clear Completed</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>

</html>
